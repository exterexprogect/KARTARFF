<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Карта тревог РФ — Leaflet + Telegram</title>
    <!-- Leaflet CSS + JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; background: #0a0a0a; }
        #map { width: 100vw; height: 100vh; background: #000; }

        .orbit-clock {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1100;
            background: transparent;
            font-family: 'Orbitron', monospace;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        .orbit-time { font-size: 36px; font-weight: 700; color: #ffffff; letter-spacing: 3px; line-height: 1; }
        .orbit-date { font-size: 12px; font-weight: 400; color: #aaaaaa; letter-spacing: 1px; margin-top: 5px; }

        .legend-summary-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 320px;
            max-height: calc(100vh - 100px);
            background: rgba(10, 15, 25, 0.75);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            pointer-events: auto;
            font-size: 12px;
        }
        .legend-header {
            padding: 12px 18px;
            font-weight: bold;
            font-size: 13px;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.3);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .legend-toggle { font-size: 14px; transition: transform 0.2s; }
        .legend-items {
            padding: 12px 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .legend-item { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #ddd; }
        .color-box { width: 20px; height: 20px; border-radius: 4px; }
        .color-clear { background: rgba(42, 42, 42, 0.6); border: 1px solid #555; }
        .color-danger { background: #cc9900; border: 1px solid #ffdd66; }
        .color-attack { background: #cc0000; border: 1px solid #ff6666; }
        .color-missile { background: #800020; border: 1px solid #ff8888; }

        .summary-header {
            padding: 12px 18px;
            font-weight: bold;
            font-size: 13px;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.3);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .summary-arrow { font-size: 14px; transition: transform 0.2s; }
        .summary-content {
            padding: 12px 16px;
            overflow-y: auto;
            max-height: 300px;
        }
        .summary-content.collapsed { display: none; }
        .summary-content::-webkit-scrollbar { width: 4px; }
        .summary-content::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 10px; }
        .summary-content::-webkit-scrollbar-thumb { background: #ffaa55; border-radius: 10px; }
        .summary-time {
            font-size: 10px;
            color: #aaa;
            text-align: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-family: monospace;
        }
        .threat-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 12px;
            border-left: 3px solid #ff4444;
            padding-left: 10px;
            margin-bottom: 6px;
            color: #ffcccc;
        }
        .region-list-block {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-left: 16px;
            margin-bottom: 12px;
        }
        .region-line {
            font-size: 11px;
            color: #ffdd99;
            display: block;
            line-height: 1.35;
            cursor: pointer;
            transition: 0.1s;
        }
        .region-line:hover { color: #ffffff; text-shadow: 0 0 3px #ffaa55; }
        .sub-header { font-size: 11px; font-weight: 600; color: #ffaa66; margin: 8px 0 4px 0; }
        .copy-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 6px 0;
            border-radius: 40px;
            text-align: center;
            cursor: pointer;
            font-size: 11px;
            margin-top: 12px;
            transition: 0.2s;
            width: 100%;
        }
        .copy-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .empty-message { color: #aaa; font-style: italic; font-size: 11px; padding: 6px 0; }

        .region-tooltip {
            background: rgba(10, 15, 25, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid #ff4444;
            border-radius: 8px;
            color: #fff;
            font-size: 12px;
            padding: 4px 8px;
        }
        .leaflet-popup-content-wrapper {
            background: rgba(10, 15, 25, 0.9);
            backdrop-filter: blur(16px);
            border-radius: 12px;
            border-left: 3px solid #ff4444;
            color: #fff;
        }
        .leaflet-popup-tip { background: rgba(10, 15, 25, 0.9); }
    </style>
</head>
<body>
<div id="map"></div>

<div class="orbit-clock">
    <div class="orbit-time" id="orbitTime">--:--</div>
    <div class="orbit-date" id="orbitDate"></div>
</div>

<div class="legend-summary-panel" id="legendSummaryPanel">
    <div class="legend-header" id="legendHeader">
        <span>🚨 ТИПЫ УГРОЗ</span>
        <span class="legend-toggle" id="legendToggle">▼</span>
    </div>
    <div class="legend-items" id="legendItems">
        <div class="legend-item"><div class="color-box color-clear"></div> Отбой / Спокойно</div>
        <div class="legend-item"><div class="color-box color-danger"></div> 🟡 Опасность БПЛА</div>
        <div class="legend-item"><div class="color-box color-attack"></div> 🔴 Тревога / Атака БПЛА</div>
        <div class="legend-item"><div class="color-box color-missile"></div> 🚀 Ракетная опасность</div>
    </div>

    <div class="summary-header" id="summaryHeader">
        <span>📜 СВОДКА УГРОЗ</span>
        <span class="summary-arrow" id="summaryArrow">▼</span>
    </div>
    <div class="summary-content" id="summaryContent">
        <div id="dynamicSummaryBlock"></div>
        <div class="copy-btn" id="copySummaryBtn">📋 Копировать сводку</div>
    </div>
</div>

<script>
    // =============================================
    // 1. TELEGRAM API (для получения статусов)
    // =============================================
    const API_URL = 'https://radar-u913.onrender.com/api/statuses';
    
    const EXCLUDED_REGIONS = [
        "Донецкая Народная Республика",
        "Луганская Народная Республика",
        "Запорожская область",
        "Херсонская область",
        "ДНР", "ЛНР"
    ];

    const MONTHS_RU = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

    // ========== ВАШ РАСШИРЕННЫЙ СПИСОК REGION_ALIASES ==========
    const regionAliases = {
        "Московская область": ["московская область","подмосковье","мо обл","московской обл","московская обл","москва","мск"],
        "Санкт-Петербург": ["санкт-петербург","питер","спб","ленинград"],
        "Ленинградская область": ["ленинградская область","ленобласть","ленинградской обл"],
        "Белгородская область": ["белгород","белгородская область","белгородской обл"],
        "Брянская область": ["брянск","брянская область","брянской обл"],
        "Воронежская область": ["воронеж","воронежская область","воронежской обл"],
        "Курская область": ["курск","курская область","курской обл"],
        "Краснодарский край": ["краснодар","кубань","краснодарский край","краснодарского края"],
        "Ростовская область": ["ростов","ростов-на-дону","ростовская область","ростовской обл"],
        "Республика Татарстан": ["татарстан","казань","республика татарстан"],
        "Республика Крым": ["крым","республика крым","крыму"],
        "Калининградская область": ["калининград","калининградская область","калининградской обл"],
        "Свердловская область": ["свердловская область","екатеринбург","свердловской обл"],
        "Челябинская область": ["челябинск","челябинская область","челябинской обл"],
        "Новосибирская область": ["новосибирск","новосибирская область","новосибирской обл"],
        "Самарская область": ["самара","самарская область","самарской обл"],
        "Нижегородская область": ["нижний новгород","нижегородская область","нижегородской обл"],
        "Волгоградская область": ["волгоград","волгоградская область","волгоградской обл"],
        "Саратовская область": ["саратов","саратовская область","саратовской обл"],
        "Пермский край": ["пермь","пермский край","пермского края"],
        "Омская область": ["омск","омская область","омской обл"],
        "Томская область": ["томск","томская область","томской обл"],
        "Кемеровская область": ["кемерово","кемеровская область","кузбасс"],
        "Иркутская область": ["иркутск","иркутская область","иркутской обл"],
        "Красноярский край": ["красноярск","красноярский край","красноярского края"],
        "Алтайский край": ["барнаул","алтайский край","алтайского края"],
        "Приморский край": ["владивосток","приморский край","приморья"],
        "Хабаровский край": ["хабаровск","хабаровский край"],
        "Амурская область": ["амурская область","благовещенск","амурской обл"],
        "Архангельская область": ["архангельск","архангельская область"],
        "Мурманская область": ["мурманск","мурманская область"],
        "Республика Карелия": ["карелия","петрозаводск"],
        "Республика Коми": ["коми","сыктывкар"],
        "Ханты-Мансийский АО": ["хмао","ханты-мансийск","сургут"],
        "Ямало-Ненецкий АО": ["янао","ямал","новый уренгой"],
        "Чеченская Республика": ["чечня","грозный","чеченская республика"],
        "Республика Дагестан": ["дагестан","махачкала"],
        "Республика Башкортостан": ["башкортостан","уфа","республика башкортостан"],
        "Удмуртская Республика": ["удмуртия","ижевск"],
        "Чувашия": ["чувашская республика","чебоксары"],
        "Марий Эл": ["республика марий эл","йошкар-ола"],
        "Республика Мордовия": ["мордовия","саранск"],
        "Кировская область": ["киров","кировская область"],
        "Ульяновская область": ["ульяновск","ульяновская область"],
        "Пензенская область": ["пенза","пензенская область"],
        "Тамбовская область": ["тамбов","тамбовская область"],
        "Рязанская область": ["рязань","рязанская область"],
        "Тульская область": ["тула","тульская область"],
        "Калужская область": ["калуга","калужская область"],
        "Смоленская область": ["смоленск","смоленская область"],
        "Тверская область": ["тверь","тверская область"],
        "Владимирская область": ["владимир","владимирская область"],
        "Ивановская область": ["иваново","ивановская область"],
        "Костромская область": ["кострома","костромская область"],
        "Орловская область": ["орел","орловская область"],
        "Липецкая область": ["липецк","липецкая область"],
        "Псковская область": ["псков","псковская область"],
        "Новгородская область": ["новгород","великий новгород","новгородская область"],
        "Ярославская область": ["ярославль","ярославская область"],
        "Забайкальский край": ["забайкалье","чита","забайкальский край"],
        "Камчатский край": ["камчатка","петропавловск-камчатский"],
        "Магаданская область": ["магадан","магаданская область"],
        "Сахалинская область": ["сахалин","южно-сахалинск"],
        "Еврейская АО": ["еврейская автономная","биробиджан"],
        "Чукотский АО": ["чукотка","анадырь"]
    };

    // Функция нормализации названия региона
    function normalizeRegionName(inputName) {
        if (!inputName) return inputName;
        const lowerInput = inputName.toLowerCase();
        for (const [canonical, keys] of Object.entries(regionAliases)) {
            if (keys.some(k => lowerInput === k.toLowerCase() || lowerInput.includes(k.toLowerCase()))) {
                return canonical;
            }
        }
        return inputName.trim();
    }

    function getCurrentTimeParts() {
        const now = new Date();
        const msk = new Date(now.toLocaleString("en-US", { timeZone: "Europe/Moscow" }));
        const hours = msk.getHours().toString().padStart(2, '0');
        const minutes = msk.getMinutes().toString().padStart(2, '0');
        const day = msk.getDate().toString().padStart(2, '0');
        const month = (msk.getMonth() + 1).toString().padStart(2, '0');
        const monthName = MONTHS_RU[msk.getMonth()];
        const year = msk.getFullYear();
        return { time: `${hours}:${minutes}`, day, month, monthName, year };
    }

    function getFullDateForSummary() {
        const { time, day, month } = getCurrentTimeParts();
        return `${time} | ${day}.${month}`;
    }

    function getFullDateForClock() {
        const { day, monthName, year } = getCurrentTimeParts();
        return `${day} ${monthName} ${year}`;
    }

    let regionStatuses = new Map();
    
    function getRegionStatus(regionName) {
        const canonical = normalizeRegionName(regionName);
        return regionStatuses.get(canonical) || 'clear';
    }
    
    async function fetchAlerts() {
        try {
            const resp = await fetch(API_URL);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const apiData = await resp.json();
            if (apiData && apiData.regions) {
                regionStatuses.clear();
                for (const [regionName, info] of Object.entries(apiData.regions)) {
                    if (EXCLUDED_REGIONS.includes(regionName)) continue;
                    let status = info.status || 'clear';
                    const canonical = normalizeRegionName(regionName);
                    regionStatuses.set(canonical, status);
                }
                updateRegionColors();
                renderFullSummary();
            }
        } catch (err) { console.error('Ошибка API:', err); }
    }

    // ========== LEAFLET КАРТА ==========
    const map = L.map('map').setView([62.5, 95], 4);
    
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        subdomains: 'abcd',
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>'
    }).addTo(map);

    let geoJsonLayer = null;

    // Функция получения цвета по статусу
    function getColorByStatus(status) {
        switch(status) {
            case 'missile_alert': return '#800020';
            case 'drone_attack': return '#cc0000';
            case 'drone_danger': return '#cc9900';
            default: return '#2a2a2a';
        }
    }

    // Стиль для регионов
    function regionStyle(feature) {
        const props = feature.properties;
        const regionName = props.name || props.NAME || props.NAME_1 || '';
        const status = getRegionStatus(regionName);
        const fillColor = getColorByStatus(status);
        const borderColor = status === 'missile_alert' ? '#ff8888' : (status === 'drone_attack' ? '#ff6666' : (status === 'drone_danger' ? '#ffdd66' : '#555555'));
        const borderWidth = status === 'clear' ? 1 : 2;
        
        return {
            fillColor: fillColor,
            fillOpacity: status === 'clear' ? 0.6 : 0.75,
            color: borderColor,
            weight: borderWidth,
            opacity: 0.9
        };
    }

    // Обработчик клика и тултипа
    function onEachFeature(feature, layer) {
        const props = feature.properties;
        const regionName = props.name || props.NAME || props.NAME_1 || 'Неизвестный регион';
        const status = getRegionStatus(regionName);
        
        let statusText = '';
        if (status === 'missile_alert') statusText = '🚀 РАКЕТНАЯ ОПАСНОСТЬ';
        else if (status === 'drone_attack') statusText = '🔴 ТРЕВОГА / АТАКА БПЛА';
        else if (status === 'drone_danger') statusText = '🟡 ОПАСНОСТЬ БПЛА';
        else statusText = '🟢 Отбой / спокойно';
        
        layer.bindTooltip(regionName, { sticky: true, className: 'region-tooltip' });
        layer.on('click', () => {
            layer.bindPopup(`<b>${regionName}</b><br>${statusText}`).openPopup();
        });
    }

    // Загрузка GeoJSON и обновление цветов
    let currentGeoJsonData = null;
    
    function loadGeoJSON() {
        const geoJsonUrl = 'https://raw.githubusercontent.com/codeforamerica/click_that_hood/master/public/data/russia.geojson';
        
        fetch(geoJsonUrl)
            .then(response => response.json())
            .then(data => {
                currentGeoJsonData = data;
                if (geoJsonLayer) map.removeLayer(geoJsonLayer);
                geoJsonLayer = L.geoJSON(data, {
                    style: regionStyle,
                    onEachFeature: onEachFeature
                }).addTo(map);
                map.fitBounds(geoJsonLayer.getBounds());
                console.log('✅ GeoJSON загружен');
            })
            .catch(error => console.error('Ошибка загрузки GeoJSON:', error));
    }

    // Обновление цветов регионов без перезагрузки карты
    function updateRegionColors() {
        if (!geoJsonLayer) return;
        
        geoJsonLayer.eachLayer(layer => {
            const feature = layer.feature;
            if (feature) {
                const props = feature.properties;
                const regionName = props.name || props.NAME || props.NAME_1 || '';
                const status = getRegionStatus(regionName);
                layer.setStyle(regionStyle(feature));
                
                // Обновляем попап при клике (если открыт)
                const statusText = status === 'missile_alert' ? '🚀 РАКЕТНАЯ ОПАСНОСТЬ' :
                                  (status === 'drone_attack' ? '🔴 ТРЕВОГА / АТАКА БПЛА' :
                                  (status === 'drone_danger' ? '🟡 ОПАСНОСТЬ БПЛА' : '🟢 Отбой / спокойно'));
                layer.unbindPopup();
                layer.bindPopup(`<b>${regionName}</b><br>${statusText}`);
            }
        });
    }

    function renderFullSummary() {
        let attack = [], danger = [];
        for (let [name, status] of regionStatuses.entries()) {
            if (status === 'missile_alert' || status === 'drone_attack') attack.push(name);
            else if (status === 'drone_danger') danger.push(name);
        }
        attack.sort(); danger.sort();
        
        const dateTimeStr = getFullDateForSummary();
        
        let html = '';
        html += `<div class="summary-time">🕐 ${dateTimeStr}</div>`;
        html += `<div class="threat-header">🔴 Атака БПЛА / ракет</div><div class="region-list-block">`;
        if (attack.length) attack.forEach(r => html += `<span class="region-line" data-region="${r}">• ${r}</span>`);
        else html += `<div class="empty-message">— нет угроз —</div>`;
        html += `</div><div class="sub-header">🟡 Опасность БПЛА</div><div class="region-list-block">`;
        if (danger.length) danger.forEach(r => html += `<span class="region-line" data-region="${r}">• ${r}</span>`);
        else html += `<div class="empty-message">— нет угроз —</div>`;
        html += `</div>`;
        document.getElementById('dynamicSummaryBlock').innerHTML = html;
        
        document.querySelectorAll('.region-line').forEach(el => {
            el.addEventListener('click', (e) => {
                const regionName = el.dataset.region;
                // Поиск и центрирование на регионе
                if (geoJsonLayer) {
                    geoJsonLayer.eachLayer(layer => {
                        const props = layer.feature?.properties;
                        const name = props?.name || props?.NAME || props?.NAME_1 || '';
                        if (normalizeRegionName(name) === regionName || name === regionName) {
                            map.fitBounds(layer.getBounds());
                        }
                    });
                }
            });
        });
    }

    document.getElementById('copySummaryBtn').addEventListener('click', () => {
        let attack = [], danger = [];
        for (let [name, status] of regionStatuses.entries()) {
            if (status === 'missile_alert' || status === 'drone_attack') attack.push(name);
            else if (status === 'drone_danger') danger.push(name);
        }
        const dateTimeStr = getFullDateForSummary();
        let text = `✈️ Тревоги на территории РФ ${dateTimeStr}\n\n`;
        text += `🔴 АКТИВНАЯ ТРЕВОГА (БПЛА/Ракеты):\n`;
        if (attack.length) attack.forEach(r => text += `  • ${r}\n`);
        else text += `  — нет угроз —\n`;
        text += `\n🟡 ПОТЕНЦИАЛЬНАЯ ОПАСНОСТЬ (БПЛА):\n`;
        if (danger.length) danger.forEach(r => text += `  • ${r}\n`);
        else text += `  — нет угроз —\n`;
        navigator.clipboard.writeText(text);
        const btn = document.getElementById('copySummaryBtn');
        btn.textContent = '✅ Скопировано!';
        setTimeout(() => btn.textContent = '📋 Копировать сводку', 1500);
    });

    // Свёртывание легенды
    const legendHeader = document.getElementById('legendHeader');
    const legendItems = document.getElementById('legendItems');
    const legendToggle = document.getElementById('legendToggle');
    legendHeader.addEventListener('click', () => {
        const isCollapsed = legendItems.style.display === 'none';
        if (isCollapsed) {
            legendItems.style.display = 'flex';
            legendToggle.innerHTML = '▼';
        } else {
            legendItems.style.display = 'none';
            legendToggle.innerHTML = '▲';
        }
    });

    // Свёртывание сводки
    const summaryHeader = document.getElementById('summaryHeader');
    const summaryContent = document.getElementById('summaryContent');
    const summaryArrow = document.getElementById('summaryArrow');
    summaryHeader.addEventListener('click', () => {
        const isCollapsed = summaryContent.classList.contains('collapsed');
        if (isCollapsed) {
            summaryContent.classList.remove('collapsed');
            summaryArrow.innerHTML = '▼';
        } else {
            summaryContent.classList.add('collapsed');
            summaryArrow.innerHTML = '▲';
        }
    });

    function updateOrbitClock() {
        const { time } = getCurrentTimeParts();
        const dateStr = getFullDateForClock();
        document.getElementById('orbitTime').innerHTML = time;
        document.getElementById('orbitDate').innerHTML = dateStr;
    }
    updateOrbitClock();
    setInterval(updateOrbitClock, 1000);

    // Запуск
    loadGeoJSON();
    fetchAlerts();
    setInterval(fetchAlerts, 15000);
</script>
