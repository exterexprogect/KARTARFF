        .orbit-clock {
            position: absolute; top: 20px; right: 20px; z-index: 1100;
            background: transparent; font-family: 'Orbitron', monospace; text-align: center;
            pointer-events: none; text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        .orbit-time { font-size: 36px; font-weight: 700; color: #fff; letter-spacing: 3px; }
        .orbit-date { font-size: 12px; font-weight: 400; color: #aaa; margin-top: 5px; }
        .legend-summary-panel {
            position: absolute; bottom: 20px; left: 20px; width: 320px;
            max-height: calc(100vh - 100px);
            background: linear-gradient(145deg, #2a2a2a 0%, #0f0f0f 100%);
            backdrop-filter: blur(8px); border-radius: 20px;
            border: 1px solid rgba(80,80,100,0.6); z-index: 1000;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6); font-size: 12px;
        }
        .legend-header, .summary-header {
            padding: 12px 18px; font-weight: bold; font-size: 13px; color: #e0e0e0;
            border-bottom: 1px solid rgba(100,100,120,0.5);
            background: rgba(20,20,25,0.7); cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
        }
        .legend-toggle, .summary-arrow { font-size: 14px; transition: 0.2s; color: #bbb; }
        .legend-items {
            padding: 12px 18px; display: flex; flex-direction: column; gap: 8px;
            border-bottom: 1px solid rgba(100,100,120,0.3);
            background: rgba(0,0,0,0.3);
        }
        .legend-item { display: flex; align-items: center; gap: 10px; color: #cdcdcd; }
        .color-box { width: 20px; height: 20px; border-radius: 4px; }
        .color-clear { background: rgba(42,42,42,0.8); border: 1px solid #777; }
        .color-danger { background: #cc9900; border: 1px solid #ffdd66; }
        .color-attack { background: #cc0000; border: 1px solid #ff6666; }
        .color-missile { background: #800020; border: 1px solid #ff8888; }
        .summary-content {
            padding: 12px 16px; overflow-y: auto; max-height: 300px;
            background: rgba(0,0,0,0.4);
        }
        .summary-content.collapsed { display: none; }
        .summary-time {
            font-size: 10px; color: #bbb; text-align: center; margin-bottom: 12px;
            padding-bottom: 8px; border-bottom: 1px solid rgba(120,120,140,0.4);
        }
        .threat-header {
            display: flex; align-items: center; gap: 8px; font-weight: bold;
            border-left: 3px solid #ff7795; padding-left: 10px; margin-bottom: 6px;
            color: #ffccdd;
        }
        .sub-header {
            font-size: 11px; font-weight: 600; color: #ddccaa;
            margin: 8px 0 4px 0; border-left: 3px solid #cc9900; padding-left: 10px;
        }
        .region-list-block { margin-left: 16px; margin-bottom: 12px; }
        .region-line {
            font-size: 11px; color: #d0d0e0; display: block; line-height: 1.35;
            cursor: pointer;
        }
        .region-line:hover { color: #fff; text-shadow: 0 0 3px #aaa; }
        .copy-btn {
            background: rgba(60,60,80,0.6); border: 1px solid rgba(120,120,150,0.7);
            color: #e0e0e0; padding: 6px 0; border-radius: 40px; text-align: center;
            cursor: pointer; font-size: 11px; margin-top: 12px; width: 100%;

        .copy-btn:hover { background: rgba(90,90,110,0.8); border-color: #aaa; color: white; }
        .empty-message { color: #aaa; font-style: italic; font-size: 11px; padding: 6px 0; }
        .ol-popup {

        }
        .popup-closer { float: right; font-size: 18px; color: #aaa; cursor: pointer; }
        .popup-closer:hover { color: white; }
    </style>
</head>

        "Тульская область": "Тульская обл.", "Калужская область": "Калужская обл.",
        "Рязанская область": "Рязанская обл.", "Тверская область": "Тверская обл.",
        "Ярославская область": "Ярославская обл.", "Владимирская область": "Владимирская обл.",
        "Ивановская область": "Ивановская обл.", "Костромская область": "Костромская обл.",
        "Тамбовская область": "Тамбовская обл.", "Липецкая область": "Липецкая обл.",
        "Орловская область": "Орловская обл.", "Пензенская область": "Пензенская обл.",
        "Саратовская область": "Саратовская обл.", "Ульяновская область": "Ульяновская обл.",
        "Самарская область": "Самарская обл.", "Пермский край": "Пермский край",
        "Республика Башкортостан": "Респ. Башкортостан", "Республика Татарстан": "Респ. Татарстан",
        "Республика Удмуртия": "Респ. Удмуртия", "Республика Марий Эл": "Респ. Марий Эл",
        "Республика Мордовия": "Респ. Мордовия", "Чувашская Республика": "Чувашская Респ.",
        "Кировская область": "Кировская обл.", "Оренбургская область": "Оренбургская обл.",
        "Челябинская область": "Челябинская обл.", "Свердловская область": "Свердловская обл.",
        "Курганская область": "Курганская обл.", "Тюменская область": "Тюменская обл.",
        "Омская область": "Омская обл.", "Новосибирская область": "Новосибирская обл.",
        "Томская область": "Томская обл.", "Кемеровская область": "Кемеровская обл.",
        "Алтайский край": "Алтайский край", "Красноярский край": "Красноярский край",
        "Иркутская область": "Иркутская обл.", "Забайкальский край": "Забайкальский край",
        "Республика Бурятия": "Респ. Бурятия", "Приморский край": "Приморский край",
        "Хабаровский край": "Хабаровский край", "Амурская область": "Амурская обл.",
        "Сахалинская область": "Сахалинская обл.", "Камчатский край": "Камчатский край",
        "Магаданская область": "Магаданская обл.", "Республика Саха (Якутия)": "Респ. Саха (Якутия)",
        "Еврейская АО": "Еврейская АО", "Чукотский АО": "Чукотский АО", "ЯНАО": "ЯНАО",
        "Ханты-Мансийский АО": "ХМАО", "Ненецкий АО": "Ненецкий АО", "Республика Карелия": "Респ. Карелия",
        "Республика Коми": "Респ. Коми", "Архангельская область": "Архангельская обл.",
        "Мурманская область": "Мурманская обл.", "Вологодская область": "Вологодская обл.",
        "Новгородская область": "Новгородская обл.", "Псковская область": "Псковская обл.",
        "Калининградская область": "Калининградская обл.", "Республика Алтай": "Респ. Алтай",
        "Республика Хакасия": "Респ. Хакасия", "Республика Тыва": "Респ. Тыва",
        "Республика Калмыкия": "Респ. Калмыкия", "Москва": "Москва", "Санкт-Петербург": "Санкт-Петербург"
    };

    const EXCLUDED_REGIONS = [
        "Донецкая Народная Республика", "Луганская Народная Республика",
        "Запорожская область", "Херсонская область", "ДНР", "ЛНР",
        "Крым", "Республика Крым", "Севастополь"
    ];

    const API_URL = 'https://radar-u913.onrender.com/api/statuses?api_key=aa07b7a6f91a71d1d6c77803c93b2ba0d4cd080ade0ce6147e9ff420482bec79';

    // ======================== МАППИНГ СТАТУСОВ ========================
    function mapStatusToCategory(status) {
        if (!status || status === 'clear') return 'clear';
        const lowerStatus = status.toLowerCase();
        if (lowerStatus.includes('missile') || lowerStatus.includes('rocket') || 
            lowerStatus === 'ballistic_alert' || lowerStatus === 'rocket_alert') {
            return 'missile';
        }
        if (lowerStatus === 'drone_attack' || lowerStatus === 'uav_attack') return 'attack';
        if (lowerStatus === 'drone_danger' || lowerStatus === 'uav_danger') return 'danger';
        return 'clear';
    }

    function normalizeRegionName(inputName) {
        if (!inputName) return inputName;
        let name = inputName.trim();
        if (_REGION_SYNONYMS[name]) return _REGION_SYNONYMS[name];
        let lower = name.toLowerCase();
        for (let [key, value] of Object.entries(_REGION_SYNONYMS)) {
            if (key.toLowerCase() === lower) return value;
        }
        if (lower.includes("удмурт")) return "Республика Удмуртия";
        if (lower.includes("осетия")) return "Республика Северная Осетия";
        if (name.startsWith("Республика ")) {
            let without = name.replace("Республика ", "");
            if (_REGION_SYNONYMS[without]) return _REGION_SYNONYMS[without];
        }
        if (name.endsWith(" Республика")) {
            let without = name.replace(" Республика", "");
            if (_REGION_SYNONYMS[without]) return _REGION_SYNONYMS[without];
        }
        return name;
    }

    function getShortName(canonical) {
        return _SHORT_NAMES[canonical] || canonical;
    }

    function getCurrentTimeParts() {
        const now = new Date();
        const msk = new Date(now.toLocaleString("en-US", { timeZone: "Europe/Moscow" }));
        const hours = msk.getHours().toString().padStart(2,'0');
        const minutes = msk.getMinutes().toString().padStart(2,'0');
        const day = msk.getDate().toString().padStart(2,'0');
        const month = (msk.getMonth()+1).toString().padStart(2,'0');
        const monthName = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'][msk.getMonth()];
        const year = msk.getFullYear();
        return { time: `${hours}:${minutes}`, day, month, monthName, year };
    }

    function getFullDateForSummary() {
        const { time, day, month } = getCurrentTimeParts();
        return `${time} | ${day}.${month}`;
    }
    function getFullDateForClock() {
        const { day, monthName, year } = getCurrentTimeParts();
        return `${day} ${monthName} ${year}`;
    }

    let regionCategories = new Map(); // 'missile', 'attack', 'danger', 'clear'
    function getRegionCategory(regionName) {
        const canon = normalizeRegionName(regionName);
        return regionCategories.get(canon) || 'clear';
    }

    async function fetchAlerts() {
        try {
            const resp = await fetch(API_URL);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            console.log('API response:', data);
            if (data && data.regions) {
                for (const [name, info] of Object.entries(data.regions)) {
                    if (EXCLUDED_REGIONS.some(ex => name.toLowerCase().includes(ex.toLowerCase()))) continue;
                    const rawStatus = info.status || 'clear';
                    const category = mapStatusToCategory(rawStatus);
                    const canon = normalizeRegionName(name);
                    if (regionCategories.get(canon) !== category) {
                        regionCategories.set(canon, category);
                    }
                }
                updateAllLayers();
                renderFullSummary();
            } else {
                console.warn('API response has no "regions" field');
            }
        } catch(e) { console.error('API error:', e); }
    }

    // КАРТА
    const map = new ol.Map({
        target: 'map',
        layers: [new ol.layer.Tile({ source: new ol.source.XYZ({ url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', subdomains: 'abcd' }) })],
        view: new ol.View({ center: ol.proj.fromLonLat([60, 65]), zoom: 4 }),
        controls: []
    });

    let clearSource = new ol.source.Vector();
    let dangerSource = new ol.source.Vector();
    let attackSource = new ol.source.Vector();
    let missileSource = new ol.source.Vector();

    const clearLayer = new ol.layer.Vector({ source: clearSource, style: new ol.style.Style({ fill: new ol.style.Fill({ color: 'rgba(42,42,42,0.6)' }), stroke: new ol.style.Stroke({ color: '#555', width: 1 }) }), zIndex: 5 });
    const dangerLayer = new ol.layer.Vector({ source: dangerSource, style: new ol.style.Style({ fill: new ol.style.Fill({ color: 'rgba(204,153,0,0.65)' }), stroke: new ol.style.Stroke({ color: '#cc9900', width: 2 }) }), zIndex: 6 });
    const attackLayer = new ol.layer.Vector({ source: attackSource, style: new ol.style.Style({ fill: new ol.style.Fill({ color: 'rgba(204,0,0,0.7)' }), stroke: new ol.style.Stroke({ color: '#cc0000', width: 2 }) }), zIndex: 7 });
    const missileLayer = new ol.layer.Vector({ source: missileSource, style: new ol.style.Style({ fill: new ol.style.Fill({ color: 'rgba(128,0,32,0.75)' }), stroke: new ol.style.Stroke({ color: '#800020', width: 2.2 }) }), zIndex: 8 });

    map.addLayer(clearLayer);
    map.addLayer(dangerLayer);
    map.addLayer(attackLayer);
    map.addLayer(missileLayer);

    const labelSource = new ol.source.Vector();
    const labelLayer = new ol.layer.Vector({
        source: labelSource,
        style: (feature) => {
            const zoom = map.getView().getZoom();
            let name = feature.get('name');
            if (!name || zoom < 3) return new ol.style.Style();
            const short = getShortName(name);
            const lines = short.split(' ').length > 1 ? short.split(' ') : [short];
            const fontSize = zoom < 5 ? '10px' : '12px';
            return new ol.style.Style({
                text: new ol.style.Text({
                    text: lines.join('\n'),
                    font: `500 ${fontSize} "Segoe UI"`,
                    fill: new ol.style.Fill({ color: '#fff' }),
                    stroke: new ol.style.Stroke({ color: '#000', width: 2.5 }),
                    textAlign: 'center'
                })
            });
        },
        zIndex: 20, declutter: true
    });
    map.addLayer(labelLayer);

    let allFeaturesMap = new Map();

    fetch('https://raw.githubusercontent.com/codeforamerica/click_that_hood/master/public/data/russia.geojson')
        .then(r => r.json())
        .then(geojson => {
            const format = new ol.format.GeoJSON();
            const features = format.readFeatures(geojson, { featureProjection: 'EPSG:3857' });
            let moscowFeatures = [];
            features.forEach(f => {
                let name = f.get('name');
                if (!name) return;
                if (EXCLUDED_REGIONS.some(ex => name.toLowerCase().includes(ex.toLowerCase()))) return;
                const canon = normalizeRegionName(name);
                f.set('name', canon);
                if (canon === "Московская область") { moscowFeatures.push(f); return; }
                if (canon === "Москва") { allFeaturesMap.set("Москва", f); return; }
                if (allFeaturesMap.has(canon)) {
                    const existing = allFeaturesMap.get(canon);
                    const coll = new ol.geom.GeometryCollection([existing.getGeometry(), f.getGeometry()]);
                    existing.setGeometry(coll);
                } else {
                    allFeaturesMap.set(canon, f);
                }
            });
            if (moscowFeatures.length) {
                const coll = new ol.geom.GeometryCollection(moscowFeatures.map(f => f.getGeometry()));
                const merged = moscowFeatures[0].clone();
                merged.setGeometry(coll);
                merged.set('name', "Московская область");
                allFeaturesMap.set("Московская область", merged);
            }
            for (let [name, feat] of allFeaturesMap) {
                const geom = feat.getGeometry();
                let center = null;
                if (geom.getType() === 'Polygon') center = geom.getInteriorPoint();
                else if (geom.getType() === 'MultiPolygon') {
                    let maxArea = 0, largest;
                    if (geom.getPolygons) {
                        geom.getPolygons().forEach(p => { let a = p.getArea(); if (a > maxArea) { maxArea = a; largest = p; } });
                        if (largest) center = largest.getInteriorPoint();
                    }
                } else if (geom.getType() === 'GeometryCollection') {
                    for (let g of geom.getGeometries()) {
                        if (g.getType() === 'Polygon') { center = g.getInteriorPoint(); break; }
                        if (g.getType() === 'MultiPolygon' && g.getPolygons && g.getPolygons().length) {
                            center = g.getPolygons()[0].getInteriorPoint(); break;
                        }
                    }
                }
                if (center && !labelSource.getFeatures().some(f => f.get('name') === name)) {
                    let label = new ol.Feature(center);
                    label.set('name', name);
                    labelSource.addFeature(label);
                }
            }
            updateAllLayers();
            renderFullSummary();
        }).catch(console.error);

    function updateAllLayers() {
        clearSource.clear(); dangerSource.clear(); attackSource.clear(); missileSource.clear();
        for (let [name, feat] of allFeaturesMap) {
            const category = getRegionCategory(name);
            const clone = feat.clone();
            clone.set('name', name);
            if (category === 'missile') missileSource.addFeature(clone);
            else if (category === 'attack') attackSource.addFeature(clone);
            else if (category === 'danger') dangerSource.addFeature(clone);
            else clearSource.addFeature(clone);
        }
        map.render();
    }

    // СВОДКА (совмещённая: missile + attack в один блок)
    function renderFullSummary() {
        let active = [];   // missile + attack
        let danger = [];
        for (let [canon, category] of regionCategories) {
            if (EXCLUDED_REGIONS.some(ex => canon.toLowerCase().includes(ex.toLowerCase()))) continue;
            if (category === 'missile' || category === 'attack') active.push(canon);
            else if (category === 'danger') danger.push(canon);
        }
        active.sort(); danger.sort();
        const dt = getFullDateForSummary();
        let html = `<div class="summary-time">🕐 ${dt}</div>`;
        html += `<div class="threat-header">🔴 ТРЕВОГА (БПЛА/РАКЕТЫ)</div><div class="region-list-block">`;
        if (active.length) active.forEach(r => html += `<span class="region-line" data-region="${r}">• ${getShortName(r)}</span>`);
        else html += `<div class="empty-message">— нет угроз —</div>`;
        html += `</div><div class="sub-header">🟡 ПОТЕНЦИАЛЬНАЯ ОПАСНОСТЬ (БПЛА)</div><div class="region-list-block">`;
        if (danger.length) danger.forEach(r => html += `<span class="region-line" data-region="${r}">• ${getShortName(r)}</span>`);
        else html += `<div class="empty-message">— нет угроз —</div>`;
        html += `</div>`;
        document.getElementById('dynamicSummaryBlock').innerHTML = html;
        document.querySelectorAll('.region-line').forEach(el => {
            el.addEventListener('click', () => {
                const r = el.dataset.region;
                const f = allFeaturesMap.get(r);
                if (f) map.getView().fit(f.getGeometry().getExtent(), { padding: [50,50,50,50], maxZoom: 8 });
            });
        });
    }

    document.getElementById('copySummaryBtn').addEventListener('click', () => {
        let active = [], danger = [];
        for (let [canon, category] of regionCategories) {
            if (EXCLUDED_REGIONS.some(ex => canon.toLowerCase().includes(ex.toLowerCase()))) continue;
            if (category === 'missile' || category === 'attack') active.push(canon);
            else if (category === 'danger') danger.push(canon);
        }
        const dt = getFullDateForSummary();
        let text = `✈️ Тревоги на территории РФ ${dt}\n\n`;
        text += `🔴 АКТИВНАЯ ТРЕВОГА (БПЛА/Ракеты):\n`;
        if (active.length) { active.forEach(r => text += `  • ${getShortName(r)}\n`); text += `\n`; }
        else text += ` — нет угроз —  \n\n`;
        text += `🟡 ПОТЕНЦИАЛЬНАЯ ОПАСНОСТЬ (БПЛА):\n`;
        if (danger.length) danger.forEach(r => text += `  • ${getShortName(r)}\n`);
        else text += ` — нет угроз — \n`;
        navigator.clipboard.writeText(text);
        const btn = document.getElementById('copySummaryBtn');
        btn.textContent = '✅ Скопировано!';
        setTimeout(() => btn.textContent = '📋 Копировать сводку', 1500);
    });

    // ПОПАП
    const popupElem = document.createElement('div');
    popupElem.className = 'ol-popup';
    const closer = document.createElement('a');
    closer.href = '#';
    closer.className = 'popup-closer';
    closer.innerHTML = '×';
    closer.onclick = () => { popupOverlay.setPosition(undefined); return false; };
    popupElem.appendChild(closer);
    const popupContent = document.createElement('div');
    popupElem.appendChild(popupContent);
    const popupOverlay = new ol.Overlay({ element: popupElem, autoPan: true, offset: [10, -10] });
    map.addOverlay(popupOverlay);

    map.on('singleclick', (evt) => {
        let feature = null;
        const layers = [clearLayer, dangerLayer, attackLayer, missileLayer];
        for (const layer of layers) {
            map.forEachFeatureAtPixel(evt.pixel, (f) => { feature = f; return true; }, { layerFilter: l => l === layer });
            if (feature) break;
        }
        if (feature) {
            const canon = feature.get('name');
            const category = getRegionCategory(canon);
            const display = getShortName(canon);
            let html = `<div style="font-weight: bold; font-size: 14px; margin-bottom: 6px; border-bottom: 1px solid #555; color: #ffffff;">${display}</div>`;
            let borderColor = '#888';
            let textColor = '#aaa';
            if (category === 'missile') {
                textColor = '#cc3366';
                borderColor = '#cc3366';
                html += `<div style="color: ${textColor}; font-weight: bold;"> РАКЕТНАЯ ОПАСНОСТЬ</div>`;
            } else if (category === 'attack') {
                textColor = '#cc5533';
                borderColor = '#cc5533';
                html += `<div style="color: ${textColor}; font-weight: bold;"> ТРЕВОГА БПЛА</div>`;
            } else if (category === 'danger') {
                textColor = '#ccaa44';
                borderColor = '#ccaa44';
                html += `<div style="color: ${textColor}; font-weight: bold;"> ОПАСНОСТЬ ПО БПЛА</div>`;
            } else {
                textColor = '#a0d0a0';
                borderColor = '#aaa';
                html += `<div style="color: ${textColor};"> ОТБОЙ</div>`;
            }
            popupContent.innerHTML = html;
            popupElem.style.borderLeftColor = borderColor;
            popupOverlay.setPosition(evt.coordinate);
        } else {
            popupOverlay.setPosition(undefined);
        }
    });

    // Сворачивание панелей
    document.getElementById('legendHeader').addEventListener('click', () => {
        const items = document.getElementById('legendItems');
        const toggle = document.getElementById('legendToggle');
        const isCollapsed = items.style.display === 'none';
        items.style.display = isCollapsed ? 'flex' : 'none';
        toggle.innerHTML = isCollapsed ? '▼' : '▲';
    });
    document.getElementById('summaryHeader').addEventListener('click', () => {
        const content = document.getElementById('summaryContent');
        const arrow = document.getElementById('summaryArrow');
        const isCollapsed = content.classList.contains('collapsed');
        if (isCollapsed) {
            content.classList.remove('collapsed');
            arrow.innerHTML = '▼';
        } else {
            content.classList.add('collapsed');
            arrow.innerHTML = '▲';
        }
    });

    function updateClock() {
        const { time } = getCurrentTimeParts();
        document.getElementById('orbitTime').textContent = time;
        document.getElementById('orbitDate').textContent = getFullDateForClock();
    }
    updateClock();
    setInterval(updateClock, 1000);

    fetchAlerts();
    setInterval(fetchAlerts, 15000);
</script>
</body>
