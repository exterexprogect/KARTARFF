<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Карта воздушной тревоги — Россия</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="map"></div>
    <div class="region-label-container" id="regionLabelContainer"></div>
    
    <div class="top-right-panel">
        <div class="time-widget">
            <span class="time" id="currentTime">--:--</span>
            <span class="date" id="currentDate">--.--</span>
        </div>
        <a href="https://t.me/kartatrf" target="_blank" class="tg-btn">
            <svg viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.161c-.18 1.897-.962 6.502-1.359 8.627-.168.9-.5 1.201-.82 1.23-.697.064-1.226-.46-1.901-.903-1.056-.692-1.653-1.123-2.678-1.799-1.185-.781-.417-1.21.258-1.911.177-.184 3.247-2.977 3.307-3.23.007-.032.015-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.139-5.062 3.345-.479.329-.913.489-1.302.481-.428-.008-1.252-.241-1.865-.44-.752-.244-1.349-.374-1.297-.789.027-.216.324-.437.892-.663 3.498-1.524 5.831-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635.099-.002.321.023.465.178.121.13.156.308.17.442.014.134.031.439.024.679z"/></svg>
        </a>
        <button class="menu-btn" id="menuBtn">#</button>
    </div>
    
    <div class="control-panel hidden" id="controlPanel">
        <div class="tabs">
            <button class="tab-btn active" data-tab="paint">Покраска</button>
            <button class="tab-btn" data-tab="summary">Сводка</button>
        </div>
        <div class="tab-content active" id="tabPaint">
            <div class="selected-info" id="selectedInfo" style="display:none;">
                <div id="selectedRegionName"></div>
                <div id="selectedRegionStatus"></div>
                <div id="selectedRegionTime"></div>
            </div>
            <div class="danger-buttons">
                <div class="danger-btn danger-rocket" data-level="rocket">🚀 РАКЕТНАЯ</div>
                <div class="danger-btn danger-drone" data-level="drone">✈️ БПЛА</div>
                <div class="danger-btn danger-warning" data-level="warning">⚠️ ОПАСНОСТЬ</div>
                <div class="danger-btn danger-clear" data-level="clear">✅ ОТБОЙ</div>
            </div>
            <button class="btn" id="refreshApiBtn">🔄 Обновить данные с API</button>
            <button class="btn btn-danger" id="clearAllBtn">Сбросить всё</button>
            <div class="last-update-badge" id="apiLastUpdateLabel">Последнее изменение: --:--</div>
        </div>
        <div class="tab-content" id="tabSummary">
            <div class="summary-time" id="summaryTime">Сводка на --:--</div>
            <div class="summary-block">
                <h4>🔴 ТРЕВОГА (ракета / БПЛА)</h4>
                <div class="summary-list" id="alertList">Загрузка...</div>
            </div>
            <div class="summary-block">
                <h4>🟡 ОПАСНОСТЬ БПЛА</h4>
                <div class="summary-list" id="warningList">Загрузка...</div>
            </div>
            <div class="summary-block" id="changesBlock">
                <h4>🕐 ИЗМЕНЕНИЯ ЗА ПОСЛЕДНИЙ ЧАС</h4>
                <div class="summary-list" id="changesList">—</div>
            </div>
            <button class="copy-btn" id="copyBtn">📋 Копировать сводку</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="regions-data.js"></script>
    <script src="app.js"></script>
</body>
</html>
