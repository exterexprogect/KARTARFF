<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Карта опасностей РФ — Сводка угроз</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v7.4.0/ol.css" />
    <script src="https://cdn.jsdelivr.net/npm/ol@v7.4.0/dist/ol.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; background: #0a0a0a; }
        #map { width: 100vw; height: 100vh; background: #000; }

        .center-clock {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1100; background: rgba(10,15,25,0.6); backdrop-filter: blur(16px);
            border-radius: 40px; padding: 8px 24px; color: #e8e8e8;
            font-size: 22px; font-weight: 700; border: 1px solid rgba(255,255,255,0.25);
            pointer-events: none; font-family: monospace;
        }

        .summary-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            max-height: calc(100vh - 40px);
            background: rgba(10, 15, 25, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            pointer-events: auto;
        }
        .summary-header {
            padding: 14px 18px;
            font-weight: bold;
            font-size: 14px;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.3);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .summary-header span:first-child {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .summary-arrow {
            font-size: 16px;
            transition: transform 0.2s;
        }
        .summary-content {
            padding: 12px 16px;
            overflow-y: auto;
            max-height: 400px;
        }
        .summary-content.collapsed {
            display: none;
        }
        .summary-content::-webkit-scrollbar {
            width: 4px;
        }
        .summary-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .summary-content::-webkit-scrollbar-thumb {
            background: #ffaa55;
            border-radius: 10px;
        }
        .summary-time {
            font-size: 11px;
            color: #aaa;
            text-align: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .threat-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 13px;
            border-left: 3px solid #ff4444;
            padding-left: 10px;
            margin-bottom: 8px;
            color: #ffcccc;
        }
        .region-list-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-left: 16px;
            margin-bottom: 16px;
        }
        .region-line {
            font-size: 12px;
            color: #ffdd99;
            display: block;
            line-height: 1.35;
            cursor: pointer;
            transition: 0.1s;
        }
        .region-line:hover {
            color: #ffffff;
            text-shadow: 0 0 3px #ffaa55;
        }
        .sub-header {
            font-size: 12px;
            font-weight: 600;
            color: #ffaa66;
            margin: 10px 0 5px 0;
        }
        .copy-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 6px 0;
            border-radius: 40px;
            text-align: center;
            cursor: pointer;
            font-size: 11px;
            margin-top: 12px;
            transition: 0.2s;
            width: 100%;
        }
        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .empty-message {
            color: #aaa;
            font-style: italic;
            font-size: 12px;
            padding: 8px 0;
        }

        .legend {
            position: absolute; bottom: 20px; left: 20px; z-index: 1000;
            background: rgba(10,15,25,0.7); backdrop-filter: blur(16px);
            border-radius: 16px; padding: 12px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            font-size: 12px; color: #ddd;
            pointer-events: none;
        }
        .legend-title { font-weight: bold; margin-bottom: 8px; color: #fff; font-size: 13px; }
        .legend-item { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
        .color-box { width: 20px; height: 20px; border-radius: 4px; }
        .color-clear { background: #2a2a2a; border: 1px solid #555; }
        .color-danger { background: #cc9900; border: 1px solid #ffdd66; }
        .color-attack { background: #cc0000; border: 1px solid #ff6666; }
        .color-missile { background: #800020; border: 1px solid #ff8888; }

        .ol-popup {
            background: rgba(10,15,25,0.9); backdrop-filter: blur(16px); border-radius: 16px;
            border-left: 4px solid #ff4444; color: #f0f0f0; padding: 12px; min-width: 200px;
            pointer-events: auto;
            position: absolute;
        }
        .popup-closer { float: right; font-size: 18px; color: #aaa; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>
<div id="map"></div>
<div class="center-clock" id="clock">--:--</div>

<div class="summary-panel" id="summaryPanel">
    <div class="summary-header" id="summaryHeader">
        <span>📜</span>
        <span class="summary-arrow" id="summaryArrow">▼</span>
    </div>
    <div class="summary-content" id="summaryContent">
        <div id="dynamicSummaryBlock"></div>
        <div class="copy-btn" id="copySummaryBtn">📋 Копировать сводку</div>
    </div>
</div>

<div class="legend">
    <div class="legend-title">🚨 ТИПЫ УГРОЗ</div>
    <div class="legend-item"><div class="color-box color-clear"></div> Отбой / Спокойно</div>
    <div class="legend-item"><div class="color-box color-danger"></div> Опасность БПЛА</div>
    <div class="legend-item"><div class="color-box color-attack"></div> Тревога БПЛА</div>
    <div class="legend-item"><div class="color-box color-missile"></div> Ракетная опасность</div>
</div>

<script>
    const API_URL = 'https://radar-twp9.onrender.com/api/statuses';
    
    // Исключённые регионы
    const EXCLUDED_REGIONS = [
        "Донецкая Народная Республика",
        "Луганская Народная Республика",
        "Запорожская область",
        "Херсонская область",
        "Республика Крым",
        "Крым",
        "Севастополь",
        "ДНР", "ЛНР"
    ];

    // ========== РАСШИРЕННЫЕ СЛОВАРИ ==========
    const CITY_TO_REGION = {
        "Москва": "Московская область", "МСК": "Московская область",
        "Санкт-Петербург": "Ленинградская область", "СПБ": "Ленинградская область", "Питер": "Ленинградская область",
        "Самара": "Самарская область", "Казань": "Республика Татарстан",
        "Нижний Новгород": "Нижегородская область", "Н.Новгород": "Нижегородская область",
        "Саратов": "Саратовская область", "Волгоград": "Волгоградская область",
        "Ульяновск": "Ульяновская область", "Пенза": "Пензенская область",
        "Тольятти": "Самарская область", "Набережные Челны": "Республика Татарстан",
        "Ростов-на-Дону": "Ростовская область", "Краснодар": "Краснодарский край",
        "Ставрополь": "Ставропольский край", "Воронеж": "Воронежская область",
        "Астрахань": "Астраханская область", "Екатеринбург": "Свердловская область",
        "Челябинск": "Челябинская область", "Уфа": "Республика Башкортостан",
        "Пермь": "Пермский край", "Тюмень": "Тюменская область",
        "Омск": "Омская область", "Новосибирск": "Новосибирская область",
        "Красноярск": "Красноярский край", "Иркутск": "Иркутская область",
        "Махачкала": "Республика Дагестан", "Грозный": "Чеченская Республика",
        "Назрань": "Республика Ингушетия", "Владикавказ": "Республика Северная Осетия",
        "Нальчик": "Кабардино-Балкарская Республика", "Черкесск": "Карачаево-Черкесская Республика",
        "Майкоп": "Республика Адыгея", "Элиста": "Республика Калмыкия",
        "Петрозаводск": "Республика Карелия", "Сыктывкар": "Республика Коми",
        "Калининград": "Калининградская область", "Владивосток": "Приморский край",
        "Хабаровск": "Хабаровский край", "Ижевск": "Республика Удмуртия",
        "Чебоксары": "Чувашская Республика", "Саранск": "Республика Мордовия"
    };

    const REGION_ALIASES = {
        "Москва": "Московская область",
        "Московская область": "Московская область",
        "Московская обл.": "Московская область",
        "Московская губерния": "Московская область",
        "г. Москва": "Московская область",
        "город Москва": "Московская область",
        
        "Удмуртия": "Республика Удмуртия", "Республика Удмуртия": "Республика Удмуртия", "Удмуртская Республика": "Республика Удмуртия",
        "Чечня": "Чеченская Республика", "Чеченская Республика": "Чеченская Республика",
        "Северная Осетия": "Республика Северная Осетия", "Республика Северная Осетия": "Республика Северная Осетия", "Сев. Осетия": "Республика Северная Осетия",
        "Ингушетия": "Республика Ингушетия", "Республика Ингушетия": "Республика Ингушетия",
        "Кабардино-Балкария": "Кабардино-Балкарская Республика", "Кабардино-Балкарская Республика": "Кабардино-Балкарская Республика",
        "Карачаево-Черкесия": "Карачаево-Черкесская Республика", "Карачаево-Черкесская Республика": "Карачаево-Черкесская Республика",
        "Мордовия": "Республика Мордовия", "Республика Мордовия": "Республика Мордовия",
        "Татарстан": "Республика Татарстан", "Республика Татарстан": "Республика Татарстан",
        "Дагестан": "Республика Дагестан", "Республика Дагестан": "Республика Дагестан",
        "Калмыкия": "Республика Калмыкия", "Республика Калмыкия": "Республика Калмыкия",
        "Адыгея": "Республика Адыгея", "Республика Адыгея": "Республика Адыгея",
        "Башкортостан": "Республика Башкортостан", "Республика Башкортостан": "Республика Башкортостан",
        "Карелия": "Республика Карелия", "Республика Карелия": "Республика Карелия",
        "Коми": "Республика Коми", "Республика Коми": "Республика Коми",
        "Марий Эл": "Республика Марий Эл", "Республика Марий Эл": "Республика Марий Эл",
        "Чувашия": "Чувашская Республика", "Чувашская Республика": "Чувашская Республика",
        
        "Ленинградская обл.": "Ленинградская область",
        "Нижегородская обл.": "Нижегородская область",
        "Самарская обл.": "Самарская область",
        "Саратовская обл.": "Саратовская область",
        "Волгоградская обл.": "Волгоградская область",
        "Ростовская обл.": "Ростовская область",
        
        "Краснодарский край": "Краснодарский край",
        "Ставропольский край": "Ставропольский край",
        "Пермский край": "Пермский край",
        "Хабаровский край": "Хабаровский край",
        "Приморский край": "Приморский край",
        "Красноярский край": "Красноярский край",
        "Алтайский край": "Алтайский край"
    };

    function normalizeRegionName(inputName) {
        if (!inputName) return inputName;
        
        if (inputName === "Москва" || inputName === "г. Москва" || inputName === "город Москва" || inputName === "Moscow") {
            return "Московская область";
        }
        if (inputName === "Московская область" || inputName === "Московская обл.") {
            return "Московская область";
        }
        
        if (CITY_TO_REGION[inputName]) {
            const region = CITY_TO_REGION[inputName];
            return REGION_ALIASES[region] || region;
        }
        
        if (REGION_ALIASES[inputName]) return REGION_ALIASES[inputName];
        
        const lowerInput = inputName.toLowerCase();
        for (const [alias, canonical] of Object.entries(REGION_ALIASES)) {
            if (lowerInput === alias.toLowerCase() || lowerInput.includes(alias.toLowerCase()) || alias.toLowerCase().includes(lowerInput)) {
                return canonical;
            }
        }
        
        for (const [city, region] of Object.entries(CITY_TO_REGION)) {
            if (lowerInput.includes(city.toLowerCase())) {
                return REGION_ALIASES[region] || region;
            }
        }
        
        return inputName.trim();
    }

    // Функция для получения текущего времени и даты
    function getCurrentTimeString() {
        const now = new Date();
        const msk = new Date(now.toLocaleString("en-US", { timeZone: "Europe/Moscow" }));
        const hours = msk.getHours().toString().padStart(2, '0');
        const minutes = msk.getMinutes().toString().padStart(2, '0');
        const day = msk.getDate().toString().padStart(2, '0');
        const month = (msk.getMonth() + 1).toString().padStart(2, '0');
        return `${hours}:${minutes} | ${day}.${month}`;
    }

    let regionStatuses = new Map();
    
    function getRegionStatus(regionName) {
        const canonical = normalizeRegionName(regionName);
        return regionStatuses.get(canonical) || 'clear';
    }
    
    async function fetchAlerts() {
        try {
            const resp = await fetch(API_URL);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const apiData = await resp.json();
            if (apiData && apiData.regions) {
                regionStatuses.clear();
                for (const [regionName, info] of Object.entries(apiData.regions)) {
                    if (EXCLUDED_REGIONS.includes(regionName)) continue;
                    let status = info.status || 'clear';
                    const canonical = normalizeRegionName(regionName);
                    regionStatuses.set(canonical, status);
                }
                updateAllLayers();
                renderFullSummary();
            }
        } catch (err) { console.error('Ошибка API:', err); }
    }

    // ========== КАРТА И 4 СЛОЯ ==========
    const map = new ol.Map({
        target: 'map',
        layers: [new ol.layer.Tile({ source: new ol.source.XYZ({ url: 'https://{a-c}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png' }) })],
        view: new ol.View({ center: ol.proj.fromLonLat([60, 65]), zoom: 4 }),
        controls: []
    });

    let clearSource = new ol.source.Vector();
    let dangerSource = new ol.source.Vector();
    let attackSource = new ol.source.Vector();
    let missileSource = new ol.source.Vector();

    const clearLayer = new ol.layer.Vector({
        source: clearSource,
        style: new ol.style.Style({ fill: new ol.style.Fill({ color: 'rgba(42, 42, 42, 0.6)' }), stroke: new ol.style.Stroke({ color: '#555555', width: 1 }) }),
        zIndex: 5
    });
    
    const dangerLayer = new ol.layer.Vector({
        source: dangerSource,
        style: new ol.style.Style({ fill: new ol.style.Fill({ color: 'rgba(204, 153, 0, 0.65)' }), stroke: new ol.style.Stroke({ color: '#cc9900', width: 2 }) }),
        zIndex: 6
    });
    
    const attackLayer = new ol.layer.Vector({
        source: attackSource,
        style: new ol.style.Style({ fill: new ol.style.Fill({ color: 'rgba(204, 0, 0, 0.7)' }), stroke: new ol.style.Stroke({ color: '#cc0000', width: 2 }) }),
        zIndex: 7
    });
    
    const missileLayer = new ol.layer.Vector({
        source: missileSource,
        style: new ol.style.Style({ fill: new ol.style.Fill({ color: 'rgba(128, 0, 32, 0.75)' }), stroke: new ol.style.Stroke({ color: '#800020', width: 2.2 }) }),
        zIndex: 8
    });

    map.addLayer(clearLayer);
    map.addLayer(dangerLayer);
    map.addLayer(attackLayer);
    map.addLayer(missileLayer);

    const labelSource = new ol.source.Vector();
    const labelLayer = new ol.layer.Vector({
        source: labelSource,
        style: (feature) => {
            const zoom = map.getView().getZoom();
            let name = feature.get('name');
            if (!name || zoom < 3) return new ol.style.Style();
            
            function splitName(n) {
                if (n.includes('Республика')) {
                    const parts = n.split(' ');
                    if (parts.length >= 2) return [parts[0], parts.slice(1).join(' ')];
                }
                if (n.includes('область')) {
                    const parts = n.split(' ');
                    if (parts.length >= 2) return [parts[0], parts.slice(1).join(' ')];
                }
                if (n.includes('край')) {
                    const parts = n.split(' ');
                    if (parts.length >= 2) {
                        if (n === "Краснодарский край") return ["Краснодарский", "край"];
                        if (n === "Ставропольский край") return ["Ставропольский", "край"];
                        return [parts[0], parts.slice(1).join(' ')];
                    }
                }
                const spaceIndex = n.indexOf(' ');
                if (spaceIndex > 0 && n.length - spaceIndex < 25) {
                    return [n.substring(0, spaceIndex), n.substring(spaceIndex + 1)];
                }
                return [n];
            }
            
            const lines = splitName(name);
            const fontSize = zoom < 5 ? '10px' : '12px';
            
            return new ol.style.Style({
                text: new ol.style.Text({
                    text: lines.join('\n'),
                    font: `500 ${fontSize} "Segoe UI"`,
                    fill: new ol.style.Fill({ color: '#ffffff' }),
                    stroke: new ol.style.Stroke({ color: '#000000', width: 2.5 }),
                    textAlign: 'center',
                    offsetY: 0
                })
            });
        },
        zIndex: 20,
        declutter: true
    });
    map.addLayer(labelLayer);

    let allFeaturesMap = new Map();

    fetch('https://raw.githubusercontent.com/codeforamerica/click_that_hood/master/public/data/russia.geojson')
        .then(r => r.json())
        .then(geojson => {
            const format = new ol.format.GeoJSON();
            const features = format.readFeatures(geojson, { featureProjection: 'EPSG:3857' });
            features.forEach(feature => {
                let name = feature.get('name');
                if (!name) return;
                if (EXCLUDED_REGIONS.some(ex => name.includes(ex))) return;
                
                const normalized = normalizeRegionName(name);
                feature.set('name', normalized);
                
                if (allFeaturesMap.has(normalized)) {
                    const existingFeature = allFeaturesMap.get(normalized);
                    const existingGeom = existingFeature.getGeometry();
                    const newGeom = feature.getGeometry();
                    const collection = new ol.geom.GeometryCollection([existingGeom, newGeom]);
                    existingFeature.setGeometry(collection);
                } else {
                    allFeaturesMap.set(normalized, feature);
                }
                
                const geom = feature.getGeometry();
                let centerPoint = null;
                if (geom.getType() === 'MultiPolygon') {
                    let maxArea = 0, largest;
                    if (geom.getPolygons) {
                        geom.getPolygons().forEach(p => { const area = p.getArea(); if (area > maxArea) { maxArea = area; largest = p; } });
                        if (largest) centerPoint = largest.getInteriorPoint();
                    }
                } else if (geom.getType() === 'Polygon') {
                    centerPoint = geom.getInteriorPoint();
                } else if (geom.getType() === 'GeometryCollection') {
                    const geometries = geom.getGeometries();
                    for (let g of geometries) {
                        if (g.getType() === 'Polygon') {
                            centerPoint = g.getInteriorPoint();
                            break;
                        } else if (g.getType() === 'MultiPolygon' && g.getPolygons) {
                            const polys = g.getPolygons();
                            if (polys.length > 0) {
                                centerPoint = polys[0].getInteriorPoint();
                                break;
                            }
                        }
                    }
                }
                if (centerPoint && !labelSource.getFeatures().some(f => f.get('name') === normalized)) {
                    const labelFeature = new ol.Feature(centerPoint);
                    labelFeature.set('name', normalized);
                    labelSource.addFeature(labelFeature);
                }
            });
            updateAllLayers();
            renderFullSummary();
        })
        .catch(console.error);

    function updateAllLayers() {
        clearSource.clear();
        dangerSource.clear();
        attackSource.clear();
        missileSource.clear();
        
        for (let [name, feature] of allFeaturesMap) {
            const status = getRegionStatus(name);
            const clone = feature.clone();
            clone.set('name', name);
            
            if (status === 'missile_alert') {
                missileSource.addFeature(clone);
            } else if (status === 'drone_attack') {
                attackSource.addFeature(clone);
            } else if (status === 'drone_danger') {
                dangerSource.addFeature(clone);
            } else {
                clearSource.addFeature(clone);
            }
        }
        map.render();
    }

    function renderFullSummary() {
        let attack = [];
        let danger = [];
        
        for (let [name, status] of regionStatuses.entries()) {
            if (EXCLUDED_REGIONS.some(ex => name.includes(ex) || ex.includes(name))) continue;
            
            if (status === 'missile_alert' || status === 'drone_attack') {
                attack.push(name);
            } else if (status === 'drone_danger') {
                danger.push(name);
            }
        }
        
        attack.sort();
        danger.sort();
        
        const timeString = getCurrentTimeString();
        
        let html = '';
        html += `<div class="summary-time">🕐 ${timeString} МСК</div>`;
        
        html += `<div class="threat-header">🔴 Атака БПЛА / ракет</div>`;
        html += `<div class="region-list-block">`;
        if (attack.length > 0) {
            attack.forEach(r => {
                html += `<span class="region-line" data-region="${r}">• ${r}</span>`;
            });
        } else {
            html += `<div class="empty-message">— нет угроз —</div>`;
        }
        html += `</div>`;
        
        html += `<div class="sub-header">🟡 Опасность БПЛА</div>`;
        html += `<div class="region-list-block">`;
        if (danger.length > 0) {
            danger.forEach(r => {
                html += `<span class="region-line" data-region="${r}">• ${r}</span>`;
            });
        } else {
            html += `<div class="empty-message">— нет угроз —</div>`;
        }
        html += `</div>`;
        
        document.getElementById('dynamicSummaryBlock').innerHTML = html;
        
        document.querySelectorAll('.region-line').forEach(el => {
            el.addEventListener('click', (e) => {
                const regionName = el.dataset.region;
                const feature = allFeaturesMap.get(regionName);
                if (feature) {
                    const geom = feature.getGeometry();
                    if (geom) map.getView().fit(geom.getExtent(), { padding: [50, 50, 50, 50], maxZoom: 8 });
                }
            });
        });
    }

    document.getElementById('copySummaryBtn').addEventListener('click', () => {
        let attack = [];
        let danger = [];
        
        for (let [name, status] of regionStatuses.entries()) {
            if (EXCLUDED_REGIONS.some(ex => name.includes(ex) || ex.includes(name))) continue;
            if (status === 'missile_alert' || status === 'drone_attack') attack.push(name);
            else if (status === 'drone_danger') danger.push(name);
        }
        
        const timeString = getCurrentTimeString();
        
        let text = `✈️ Тревоги на территории РФ ${timeString} МСК\n\n`;
        text += `🔴 АКТИВНАЯ ТРЕВОГА (БПЛА/Ракеты):\n`;
        if (attack.length) attack.forEach(r => text += `  • ${r}\n`);
        else text += `  — нет угроз —\n`;
        
        text += `\n🟡 ПОТЕНЦИАЛЬНАЯ ОПАСНОСТЬ БПЛА:\n`;
        if (danger.length) danger.forEach(r => text += `  • ${r}\n`);
        else text += `  — нет угроз —\n`;
        
        navigator.clipboard.writeText(text);
        const btn = document.getElementById('copySummaryBtn');
        btn.textContent = 'Скопировано!';
        setTimeout(() => { btn.textContent = '📋 Копировать сводку'; }, 1500);
    });

    // Попап
    const popupElement = document.createElement('div');
    popupElement.className = 'ol-popup';
    const popupCloser = document.createElement('a');
    popupCloser.href = '#';
    popupCloser.className = 'popup-closer';
    popupCloser.innerHTML = '×';
    popupCloser.onclick = () => { popupOverlay.setPosition(undefined); return false; };
    popupElement.appendChild(popupCloser);
    const popupContent = document.createElement('div');
    popupElement.appendChild(popupContent);
    
    const popupOverlay = new ol.Overlay({ element: popupElement, autoPan: true, offset: [10, -10] });
    map.addOverlay(popupOverlay);
    
    map.on('singleclick', (evt) => {
        let feature = null;
        const layers = [clearLayer, dangerLayer, attackLayer, missileLayer];
        for (const layer of layers) {
            map.forEachFeatureAtPixel(evt.pixel, (f) => { feature = f; return true; }, { layerFilter: (l) => l === layer });
            if (feature) break;
        }
        
        if (feature) {
            const name = feature.get('name');
            const status = getRegionStatus(name);
            let html = `<div style="font-weight: bold; font-size: 14px; margin-bottom: 6px; border-bottom: 1px solid #333;">${name}</div>`;
            if (status === 'missile_alert') html += `<div style="color: #ff6666; font-weight: bold;">🚀 РАКЕТНАЯ ОПАСНОСТЬ</div>`;
            else if (status === 'drone_attack') html += `<div style="color: #ff6666; font-weight: bold;">🔴 ТРЕВОГА БПЛА</div>`;
            else if (status === 'drone_danger') html += `<div style="color: #ffcc66; font-weight: bold;">🟡 ОПАСНОСТЬ БПЛА</div>`;
            else html += `<div style="color: #80c080;">🟢 Отбой / спокойно</div>`;
            popupContent.innerHTML = html;
            popupOverlay.setPosition(evt.coordinate);
        } else {
            popupOverlay.setPosition(undefined);
        }
    });

    // Свёртывание сводки
    const summaryHeader = document.getElementById('summaryHeader');
    const summaryContent = document.getElementById('summaryContent');
    const summaryArrow = document.getElementById('summaryArrow');
    
    summaryHeader.addEventListener('click', () => {
        const isCollapsed = summaryContent.classList.contains('collapsed');
        if (isCollapsed) {
            summaryContent.classList.remove('collapsed');
            summaryArrow.innerHTML = '▼';
        } else {
            summaryContent.classList.add('collapsed');
            summaryArrow.innerHTML = '▲';
        }
    });

    function updateClock() {
        const now = new Date();
        const msk = new Date(now.toLocaleString("en-US", { timeZone: "Europe/Moscow" }));
        document.getElementById('clock').innerHTML = `${msk.getHours().toString().padStart(2, '0')}:${msk.getMinutes().toString().padStart(2, '0')}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    fetchAlerts();
    setInterval(fetchAlerts, 15000);
</script>
</body>
</html>
